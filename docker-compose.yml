version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/bot.db
      - YOUTUBE_COOKIES_CONTENT=${YOUTUBE_COOKIES_CONTENT:-}
      - POT_PROVIDER_URL=http://pot-provider:4416
    depends_on:
      - pot-provider
    volumes:
      # Persistent data storage
      - bot_data:/app/data
      - bot_downloads:/app/downloads
      # Pyrogram session (for large file uploads)
      - bot_sessions:/app/sessions
      # Note: YouTube cookies are created dynamically from YOUTUBE_COOKIES_CONTENT env var
      # and stored in /app/data/youtube_cookies.txt (part of bot_data volume)
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Generates YouTube PO tokens for yt-dlp (fixes "Sign in to confirm you're not a bot" / 403)
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: pot-provider
    restart: unless-stopped
    init: true

volumes:
  bot_data:
    driver: local
  bot_downloads:
    driver: local
  bot_sessions:
    driver: local
